<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>氛围音乐 // 像素终端</title>
  <style>
    @font-face {
      font-family: "Press Start 2P";
      src: url("fonts/PressStart2P.woff2") format("woff2");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Pixelify Sans";
      src: url("fonts/PixelifySans.woff2") format("woff2");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Pixelify Sans";
      src: url("fonts/PixelifySans-Bold.woff2") format("woff2");
      font-weight: bold; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("fonts/SpaceGrotesk.woff2") format("woff2");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("fonts/SpaceGrotesk-SemiBold.woff2") format("woff2");
      font-weight: 600; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Space Grotesk";
      src: url("fonts/SpaceGrotesk-Bold.woff2") format("woff2");
      font-weight: 700; font-style: normal; font-display: swap;
    }

    :root {
      --surface: #131314;
      --surface-lowest: #0e0e0f;
      --surface-low: #161617;
      --surface-mid: #1e1f20;
      --surface-high: #29282a;
      --surface-highest: #353436;
      --on-surface: #e5e2e3;
      --on-surface-dim: #9b9a9c;
      --primary: #6feee1;
      --primary-dim: #5adace;
      --primary-glow: rgba(111,238,225,.55);
      --primary-glow-soft: rgba(111,238,225,.28);
      --primary-glow-faint: rgba(111,238,225,.12);
      --secondary: #bcc7de;
      --on-primary: #0e0e0f;
      --outline: #869491;
      --outline-variant: #3c4947;
      --error: #ffb4ab;
      --amber: #ffd36e;
      --amber-glow: rgba(255,211,110,.35);
      --red: #ff6f7f;
      --red-glow: rgba(255,111,127,.35);
      --cyan: #6fd6ff;
      --cyan-glow: rgba(111,214,255,.35);
      --dot-gap: 24px;
      --progress-h: 2px;
      --playhead: 10px;
      --ease: cubic-bezier(.4,0,.2,1);
      --dur-pulse: 2.4s;
      --dur-blink: 1.05s;
      --dur-scan: 8s;
      --font-display: "Space Grotesk", "Pixelify Sans", ui-sans-serif, system-ui, sans-serif;
      --font-body: "Pixelify Sans", "LXGW WenKai Mono", "Microsoft YaHei UI", ui-sans-serif, system-ui, sans-serif;
      --font-pixel: "Press Start 2P", monospace;
      --tracking-headline: .08em;
      --tracking-label: .12em;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--surface);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: 16px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }

    .dot-matrix-bg {
      background-color: var(--surface);
      background-image: radial-gradient(
        circle at center,
        var(--outline-variant) 0, var(--outline-variant) 1px,
        transparent 1px, transparent 100%
      );
      background-size: var(--dot-gap) var(--dot-gap);
      background-position: 0 0;
    }

    .scanline-overlay { position: relative; overflow: hidden; }
    .scanline-overlay::after {
      content: ""; pointer-events: none;
      position: absolute; inset: 0; z-index: 50;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0, transparent 2px,
        rgba(229,226,227,.04) 2px, rgba(229,226,227,.04) 3px
      );
      mix-blend-mode: soft-light;
      animation: scanline var(--dur-scan) linear infinite;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); opacity: .06; }
      35% { opacity: .12; }
      100% { transform: translateY(100%); opacity: .06; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: .82; filter: brightness(1.35); }
    }

    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: .5; filter: brightness(.8) blur(.5px); transform: scale(.85); }
      50% { opacity: 1; filter: brightness(1.6) blur(0); transform: scale(1.25); }
    }

    @keyframes fly {
      from { transform: translateX(0); }
      to { transform: translateX(calc(-100vw - 100%)); }
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(-8px); }
      15% { opacity: 1; transform: translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .crt-glow {
      box-shadow:
        inset 0 0 48px var(--primary-glow-soft),
        inset 0 0 120px rgba(111,238,225,.12);
      outline: 1px solid var(--outline-variant);
    }

    .glow-dot {
      display: inline-block; border-radius: 50%;
      animation: glow-pulse 1.5s ease-in-out infinite;
    }
    .glow-dot.primary { background: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
    .glow-dot.error { background: var(--error); box-shadow: 0 0 10px rgba(255,180,171,.7); }

    .colon-blink { animation: blink 1s steps(1) infinite; }

    .terminal-cursor {
      display: inline-block; width: .55em; min-height: 1em;
      background: var(--primary); vertical-align: text-bottom;
      animation: blink var(--dur-blink) steps(1, end) infinite;
    }

    .label {
      font-family: var(--font-display);
      letter-spacing: var(--tracking-label);
      font-size: .75rem; text-transform: uppercase; font-weight: 600;
    }

    button, input { font: inherit; letter-spacing: 0; }

    .desktop {
      width: 100vw; height: 100vh;
      min-width: 1024px; min-height: 680px;
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
    }

    .window {
      width: 100%; height: 100%;
      max-width: 80rem;
      display: flex; flex-direction: column;
      overflow: hidden;
      border-radius: 6px;
      border: 1px solid var(--outline-variant);
      background: color-mix(in srgb, var(--surface) 97%, transparent);
      box-shadow: 0 4px 32px rgba(0,0,0,.5);
    }

    .appbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 20px;
      border-bottom: 1px solid var(--outline-variant);
      background: color-mix(in srgb, var(--surface-low) 94%, transparent);
      flex-shrink: 0;
    }

    .brand {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--font-display);
      font-weight: 700; font-size: 15px;
      letter-spacing: var(--tracking-headline);
      color: var(--primary);
      text-shadow: 0 0 12px var(--primary-glow-soft);
    }

    .brand-icon {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border: 1px solid var(--outline-variant);
      border-radius: 4px;
      background: var(--surface-mid);
      color: var(--primary);
      font-family: var(--font-pixel);
      font-size: 10px;
      text-shadow: 0 0 8px var(--primary-glow);
    }

    .appbar-nav { display: flex; align-items: center; gap: 16px; }

    .mode-switch {
      display: flex; border-radius: 4px; overflow: hidden;
      border: 1px solid var(--outline-variant);
    }

    .mode-btn {
      padding: 6px 16px; border: none; cursor: pointer;
      font-family: var(--font-display);
      font-size: 11px; font-weight: 600;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      background: var(--surface-low);
      color: var(--on-surface-dim);
      transition: all .15s var(--ease);
    }
    .mode-btn:hover { background: var(--surface-mid); color: var(--on-surface); }
    .mode-btn.on {
      background: var(--primary); color: var(--on-primary);
      text-shadow: none;
    }

    .win-buttons { display: flex; gap: 8px; margin-left: 8px; }

    .win-btn {
      width: 14px; height: 14px; border-radius: 50%;
      border: none; cursor: pointer; padding: 0;
      transition: filter .15s var(--ease);
      position: relative;
      display: grid; place-items: center;
    }
    .win-btn.minimize { background: var(--outline-variant); }
    .win-btn.maximize { background: var(--primary-dim); }
    .win-btn.close { background: var(--error); }
    .win-btn:hover { filter: brightness(1.4); }
    .win-btn svg {
      width: 8px; height: 8px;
      opacity: 0;
      transition: opacity .1s var(--ease);
    }
    .win-btn:hover svg { opacity: 1; }
    .win-btn svg line, .win-btn svg polyline {
      stroke: rgba(0,0,0,.6);
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
    }

    .main-content {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
    }

    .left-col {
      display: flex; flex-direction: column;
      gap: 0; min-height: 0; overflow: hidden;
      border-right: 1px solid var(--outline-variant);
    }

    .right-col {
      display: flex; flex-direction: column;
      gap: 0; min-height: 0; overflow: hidden;
    }

    .clock-section {
      padding: 20px 24px;
      border-bottom: 1px solid var(--outline-variant);
      flex-shrink: 0;
    }

    .clock-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    }

    .clock-time {
      text-align: center;
      font-family: var(--font-pixel);
      font-size: 48px; line-height: 1.05;
      color: var(--primary);
      text-shadow: 0 0 20px var(--primary-glow), 0 0 60px var(--primary-glow-soft);
    }

    .clock-date {
      margin-top: 12px;
      display: flex; align-items: baseline; justify-content: center; gap: 12px;
      font-family: var(--font-display);
    }
    .clock-date .day {
      font-size: 13px; text-transform: uppercase;
      letter-spacing: .2em; opacity: .92;
      color: var(--on-surface);
    }
    .clock-date .date-str {
      font-size: 13px; opacity: .6;
      font-family: var(--font-body);
    }

    .player-section {
      padding: 16px 24px;
      border-bottom: 1px solid var(--outline-variant);
      flex-shrink: 0;
    }

    .player-status {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }

    .status-tag {
      font-family: var(--font-display);
      font-size: 10px; font-weight: 600;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 3px;
      border: 1px solid var(--outline-variant);
      background: var(--surface-low);
      color: var(--on-surface-dim);
    }
    .status-tag.on {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-glow-faint);
    }

    .song-info {
      margin-bottom: 14px;
    }

    .song-title {
      font-family: var(--font-display);
      font-size: 20px; font-weight: 700;
      letter-spacing: var(--tracking-headline);
      color: var(--on-surface);
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .song-artist {
      font-size: 13px; color: var(--on-surface-dim);
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }

    .lyric-line {
      padding: 10px 14px;
      border-radius: 4px;
      border: 1px solid var(--outline-variant);
      background: var(--surface-low);
      color: var(--primary);
      font-size: 13px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      text-shadow: 0 0 8px var(--primary-glow-soft);
      margin-bottom: 16px;
    }

    .controls-row {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px;
    }

    .ctrl-btn {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 1px solid var(--outline-variant);
      border-radius: 4px;
      background: var(--surface-low);
      color: var(--on-surface-dim);
      cursor: pointer; font-size: 14px;
      transition: all .12s var(--ease);
    }
    .ctrl-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-glow-faint);
    }
    .ctrl-btn:active { transform: scale(.94); }
    .ctrl-btn.on {
      background: var(--primary); color: var(--on-primary);
      border-color: var(--primary);
    }

    .progress-section { margin-bottom: 10px; }

    .progress-times {
      display: flex; justify-content: space-between;
      font-family: var(--font-pixel);
      font-size: 9px; color: var(--primary);
      margin-bottom: 6px;
      text-shadow: 0 0 6px var(--primary-glow-soft);
    }

    .terminal-progress {
      position: relative; height: var(--progress-h);
      width: 100%; border-radius: 1px;
      background: var(--surface-high);
      box-shadow: inset 0 0 0 1px var(--outline-variant);
      cursor: pointer;
    }

    .terminal-progress-fill {
      height: 100%; border-radius: 1px;
      background: linear-gradient(90deg, var(--primary-dim), var(--primary));
      box-shadow:
        0 0 8px var(--primary-glow),
        0 0 24px var(--primary-glow-soft);
      transition: width .2s linear;
    }

    .terminal-progress-head {
      position: absolute; top: 50%;
      width: var(--playhead); height: var(--playhead);
      margin-top: calc(var(--playhead) / -2);
      margin-left: calc(var(--playhead) / -2);
      border-radius: 2px;
      background: var(--primary);
      border: 1px solid color-mix(in srgb, var(--primary) 60%, white);
      box-shadow:
        0 0 6px var(--primary-glow),
        0 0 18px var(--primary-glow-soft);
      transition: left .1s linear;
    }

    .volume-section {
      display: flex; align-items: center; gap: 10px;
    }

    .vol-label {
      font-family: var(--font-display);
      font-size: 10px; font-weight: 600;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--on-surface-dim);
    }

    .volume-track {
      flex: 1; max-width: 160px;
      position: relative; height: var(--progress-h);
      border-radius: 1px;
      background: var(--surface-high);
      box-shadow: inset 0 0 0 1px var(--outline-variant);
      cursor: pointer;
    }

    .volume-fill {
      height: 100%; border-radius: 1px;
      background: linear-gradient(90deg, var(--amber), rgba(255,211,110,.8));
      box-shadow: 0 0 6px var(--amber-glow);
      transition: width .15s linear;
    }

    .vol-value {
      font-family: var(--font-pixel);
      font-size: 9px; color: var(--amber);
      min-width: 24px; text-align: right;
      text-shadow: 0 0 6px var(--amber-glow);
    }

    .queue-section {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px;
      border-bottom: 1px solid var(--outline-variant);
      flex-shrink: 0;
    }

    .section-title {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-display);
      font-size: 11px; font-weight: 600;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--on-surface);
    }

    .section-count {
      font-family: var(--font-display);
      font-size: 11px; color: var(--outline);
    }

    .toolbar {
      padding: 8px 20px;
      display: flex; gap: 8px;
      border-bottom: 1px solid var(--outline-variant);
      flex-shrink: 0;
    }

    input {
      height: 30px; flex: 1; min-width: 0;
      border: 1px solid var(--outline-variant);
      border-radius: 4px;
      background: var(--surface-lowest);
      color: var(--on-surface);
      outline: none; padding: 0 12px; font-size: 12px;
      transition: border-color .15s var(--ease);
    }
    input::placeholder { color: var(--outline); }
    input:focus { border-color: var(--primary); box-shadow: 0 0 8px var(--primary-glow-faint); }

    .search-btn {
      padding: 0 14px; height: 30px;
      border: 1px solid var(--outline-variant);
      border-radius: 4px;
      background: var(--surface-low);
      color: var(--on-surface-dim);
      cursor: pointer; font-size: 11px;
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      transition: all .12s var(--ease);
    }
    .search-btn:hover {
      border-color: var(--primary); color: var(--primary);
      background: var(--primary-glow-faint);
    }

    .scroll {
      flex: 1; min-height: 0; overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--outline-variant) var(--surface-lowest);
    }
    .scroll::-webkit-scrollbar { width: 8px; }
    .scroll::-webkit-scrollbar-track { background: var(--surface-lowest); }
    .scroll::-webkit-scrollbar-thumb {
      background: var(--outline-variant); border-radius: 4px;
      border: 2px solid var(--surface-lowest);
    }
    .scroll::-webkit-scrollbar-thumb:hover { background: var(--outline); }

    .row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) 52px 44px;
      gap: 8px; align-items: center;
      min-height: 32px; padding: 0 20px;
      border-bottom: 1px solid rgba(60,73,71,.3);
      color: var(--on-surface-dim); font-size: 12px;
      cursor: pointer;
      transition: background .1s var(--ease);
    }
    .row:hover { background: var(--primary-glow-faint); color: var(--on-surface); }
    .row.head {
      color: var(--outline); text-transform: uppercase;
      min-height: 28px; font-size: 10px; cursor: default;
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: var(--tracking-label);
      background: var(--surface-low);
    }
    .row.head:hover { background: var(--surface-low); color: var(--outline); }
    .row.active {
      color: var(--primary); background: var(--primary-glow-faint);
    }
    .row.active::before {
      content: "▸"; position: absolute; left: 12px;
      color: var(--primary); font-size: 10px;
      animation: pulse var(--dur-pulse) var(--ease) infinite;
    }

    .truncate { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    .viz-section {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      border-bottom: 1px solid var(--outline-variant);
      overflow: hidden;
    }

    .viz-tabs {
      display: flex;
      border-bottom: 1px solid var(--outline-variant);
      flex-shrink: 0;
    }

    .viz-tab {
      flex: 1; padding: 8px 0;
      border: none; border-bottom: 2px solid transparent;
      background: transparent;
      font-family: var(--font-display);
      font-size: 10px; font-weight: 600;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--outline);
      cursor: pointer;
      transition: all .15s var(--ease);
    }
    .viz-tab:hover { color: var(--on-surface-dim); }
    .viz-tab.on {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .visualizer-container {
      flex: 1; min-height: 0;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 12px; gap: 2px;
      background: var(--surface-lowest);
      overflow: hidden;
    }

    .audio-bar {
      width: 4px; min-height: 2px;
      background: var(--primary);
      box-shadow: 0 0 4px var(--primary-glow-soft);
      transition: height .08s steps(3);
      border-radius: 1px 1px 0 0;
    }

    .danmaku-container {
      flex: 1; min-height: 0;
      position: relative; overflow: hidden;
      background: var(--surface-lowest);
    }

    .danmaku {
      position: absolute; left: 100%; white-space: nowrap;
      animation: fly linear forwards;
      font-size: 12px; padding: 2px 8px;
      pointer-events: none;
      color: var(--secondary);
      text-shadow: 0 0 6px rgba(188,199,222,.3);
    }

    .agent-section {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .chat {
      flex: 1; min-height: 0; overflow: auto;
      padding: 12px 16px;
      display: flex; flex-direction: column; gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--outline-variant) var(--surface-lowest);
    }

    .msg {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--outline-variant);
      background: var(--surface-low);
      color: var(--on-surface-dim);
      font-size: 12px; line-height: 1.6;
    }
    .msg.user {
      color: var(--on-surface);
      border-color: rgba(111,238,225,.2);
      background: rgba(111,238,225,.04);
      margin-left: 24px;
    }
    .msg.agent {
      border-color: rgba(188,199,222,.2);
      background: rgba(188,199,222,.04);
      margin-right: 16px;
    }
    .meta {
      font-family: var(--font-display);
      font-size: 10px; font-weight: 600;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 4px;
      text-shadow: 0 0 4px var(--primary-glow-soft);
    }

    .agent-input {
      display: flex; gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--outline-variant);
      flex-shrink: 0;
    }

    .send-btn {
      width: 34px; height: 34px; flex-shrink: 0;
      display: grid; place-items: center;
      border: 1px solid var(--outline-variant);
      border-radius: 4px;
      background: var(--surface-low);
      color: var(--primary);
      cursor: pointer; font-size: 14px;
      transition: all .12s var(--ease);
    }
    .send-btn:hover {
      border-color: var(--primary);
      background: var(--primary-glow-faint);
    }

    .statusbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 8px 20px;
      border-top: 1px solid var(--outline-variant);
      background: var(--surface-low);
      flex-shrink: 0;
    }

    .status-left, .status-right {
      display: flex; align-items: center; gap: 12px;
    }

    .status-item {
      font-family: var(--font-display);
      font-size: 10px; font-weight: 600;
      letter-spacing: var(--tracking-label);
      text-transform: uppercase;
      color: var(--outline);
    }
    .status-item.primary { color: var(--primary); }

    .no-result {
      display: flex; align-items: center; justify-content: center;
      color: var(--outline); font-size: 12px;
      padding: 24px;
      font-family: var(--font-display);
    }

    .loading {
      display: flex; align-items: center; justify-content: center;
      color: var(--primary); font-size: 11px; padding: 16px;
      font-family: var(--font-pixel);
    }
    .loading::after {
      content: ""; width: 10px; height: 10px;
      border: 2px solid var(--outline-variant); border-top-color: var(--primary);
      animation: spin .8s linear infinite; margin-left: 8px;
      border-radius: 50%;
    }

    .toast {
      position: fixed; top: 16px; right: 20px;
      background: var(--surface-mid);
      border: 1px solid var(--outline-variant);
      border-radius: 6px;
      color: var(--primary); padding: 10px 18px; font-size: 11px;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,.4), 0 0 12px var(--primary-glow-soft);
      animation: fadeInOut 2.5s ease;
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: var(--tracking-label);
    }

    .search-results {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--surface-mid);
      border: 1px solid var(--outline-variant);
      border-radius: 0 0 4px 4px;
      max-height: 300px; overflow-y: auto; z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .search-results .row { font-size: 11px; min-height: 28px; }
    .search-results .row:hover { background: var(--primary-glow-faint); }

    @media (max-width: 1100px) {
      .main-content { grid-template-columns: 1fr; }
      .clock-time { font-size: 36px; }
      .song-title { font-size: 16px; }
    }
  </style>
</head>
<body class="dot-matrix-bg scanline-overlay">
  <div class="desktop">
    <div class="window">
      <header class="appbar">
        <div class="brand">
          <span class="brand-icon">V</span>
          <span>氛围音乐</span>
        </div>
        <nav class="appbar-nav">
          <div class="mode-switch">
            <button class="mode-btn on" id="modeChip">云端</button>
            <button class="mode-btn" id="crossChip">跨平台</button>
          </div>
          <span class="win-buttons">
            <button class="win-btn minimize" id="btnMin" title="最小化"><svg viewBox="0 0 8 8"><line x1="1" y1="4" x2="7" y2="4"/></svg></button>
            <button class="win-btn maximize" id="btnMax" title="最大化"><svg viewBox="0 0 8 8"><polyline points="1,3 4,1 7,3"/><polyline points="1,5 4,7 7,5"/></svg></button>
            <button class="win-btn close" id="btnClose" title="关闭"><svg viewBox="0 0 8 8"><line x1="1.5" y1="1.5" x2="6.5" y2="6.5"/><line x1="6.5" y1="1.5" x2="1.5" y2="6.5"/></svg></button>
          </span>
        </nav>
      </header>

      <main class="main-content">
        <div class="left-col">
          <div class="clock-section scanline-overlay crt-glow">
            <div class="clock-header">
              <span class="glow-dot error" style="width:8px;height:8px"></span>
              <span class="label" style="color:var(--on-surface)">LIVE FEED</span>
              <span class="label" style="color:var(--primary)">STRM_SYNC: ACTIVE</span>
            </div>
            <div class="clock-time" id="clockDisplay">
              <span id="clockHours">00</span><span class="colon-blink">:</span><span id="clockMinutes">00</span>
            </div>
            <div class="clock-date">
              <span class="day" id="clockDay"></span>
              <span class="date-str" id="date"></span>
            </div>
          </div>

          <div class="player-section">
            <div class="player-status">
              <span class="glow-dot primary" style="width:7px;height:7px"></span>

            </div>
            <div class="song-info">

            </div>
            <div class="lyric-line" id="lyricLine">&gt; 等待播放...</div>
            <div class="controls-row">
              <button class="ctrl-btn" id="prevBtn" title="上一首">|&lt;</button>
              <button class="ctrl-btn" id="playBtn" title="播放">▶</button>
              <button class="ctrl-btn" id="nextBtn" title="下一首">&gt;|</button>
              <button class="ctrl-btn" id="modeBtn" title="列表循环">↻</button>
            </div>
            <div class="progress-section">
              <div class="progress-times">
                <span id="currentTime">00:00</span>
                <span id="totalTime">00:00</span>
              </div>
              <div class="terminal-progress" id="progressBar">
                <div class="terminal-progress-fill" id="progressFill" style="width:0%"></div>

            <div class="volume-section">

          <div class="queue-section">

        <div class="right-col">
          <div class="viz-section">
            <div class="section-head">
              <span class="section-title">
                <span class="glow-dot primary" style="width:6px;height:6px"></span>
                可视化
              </span>

            </div>

              <button class="viz-tab on" id="tabSpectrum">频谱</button>

            <div class="danmaku-container" id="danmakuView" style="display:none"></div>
          </div>

          <div class="agent-section">
            <div class="section-head">
              <span class="section-title">
                <span class="glow-dot primary" style="width:6px;height:6px"></span>
                云端助手
              </span>
              <span class="label" style="color:var(--primary)" id="syncStatus">已连接</span>
            </div>

              <div class="msg agent">
                <div class="meta">助手 00:00</div>
                系统就绪。输入歌曲名搜索，或告诉我你想听什么风格的音乐。
              </div>
            </div>
            <div class="agent-input">
              <input id="agentInput" placeholder="输入想听的歌、心情或指令...">

      <footer class="statusbar">
        <div class="status-left">
          <span class="status-item primary">
            <span class="glow-dot primary" style="width:7px;height:7px;vertical-align:middle;margin-right:6px"></span>
            SYSTEM_ONLINE
          </span>
          <span class="status-item" id="statusMem">MEM: --GB</span>
          <span class="status-item" id="statusCpu">CPU_LOAD: --%</span>
        </div>
        <div class="status-right">
          <span class="status-item">SYNC: VERIFIED</span>
          <span class="status-item" style="color:var(--on-surface)">v1.0.0-BETA</span>
        </div>
      </footer>
    </div>
  </div>

  <script>
    const API = "http://127.0.0.1:52400/api";
    let queue = [];
    let queueIndex = -1;
    let playMode = "list_loop";
    let isPlaying = false;
    let isPaused = false;
    let volume = 80;
    let currentSong = null;
    let position = 0;
    let duration = 0;
    let audio = new Audio();
    audio.volume = volume / 100;

    audio.addEventListener("ended", () => {
      isPlaying = false;
      updatePlayButton();
      playNext();
    });

    audio.addEventListener("timeupdate", () => {
      position = audio.currentTime;
      updateProgress();
    });

    audio.addEventListener("loadedmetadata", () => {
      duration = audio.duration;
      document.getElementById("totalTime").textContent = formatTime(duration);
    });

    function formatTime(s) {
      if (!s || isNaN(s)) return "00:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    }

    function formatDuration(s) {
      if (!s || isNaN(s)) return "--:--";
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return `${m}:${String(sec).padStart(2, "0")}`;
    }

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clockHours").textContent = h;
      document.getElementById("clockMinutes").textContent = m;
      const days = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
      const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      document.getElementById("clockDay").textContent = days[now.getDay()];
      document.getElementById("date").textContent =
        `${months[now.getMonth()]} ${String(now.getDate()).padStart(2, "0")}, ${now.getFullYear()}`;
    }

    function updateProgress() {
      if (duration > 0) {
        const pct = (position / duration) * 100;
        document.getElementById("progressFill").style.width = pct + "%";
        document.getElementById("progressHead").style.left = pct + "%";
      }
      document.getElementById("currentTime").textContent = formatTime(position);
    }

    function updatePlayButton() {
      const btn = document.getElementById("playBtn");
      const state = document.getElementById("playState");
      if (isPlaying && !isPaused) {
        btn.textContent = "||";
        btn.classList.add("on");
        state.textContent = "播放中";
        state.classList.add("on");
      } else {
        btn.textContent = "▶";
        btn.classList.remove("on");
        state.textContent = isPaused ? "已暂停" : "就绪";
        state.classList.toggle("on", isPaused);
      }
    }

    let queueFilterText = "";

    function updateQueueUI() {
      const container = document.getElementById("queueList");
      const countEl = document.getElementById("queueCount");
      const filtered = queueFilterText
        ? queue.filter(s => (s.title + s.artist).toLowerCase().includes(queueFilterText.toLowerCase()))
        : queue;
      countEl.textContent = filtered.length + " / " + queue.length + " 首";
      let html = `<div class="row head"><span>#</span><span>标题</span><span>来源</span><span>时长</span></div>`;
      if (filtered.length === 0) {
        html += `<div class="no-result">${queue.length === 0 ? "搜索歌曲添加到播放队列" : "无匹配结果"}</div>`;
      }
      filtered.forEach((s) => {
        const i = queue.indexOf(s);
        const active = i === queueIndex ? " active" : "";
        html += `<div class="row${active}" data-index="${i}">
          <span>${String(i + 1).padStart(2, "0")}</span>
          <span class="truncate">${s.title} - ${s.artist}</span>
          <span>${s.source || "云端"}</span>
          <span>${formatDuration(s.duration)}</span>
        </div>`;
      });
      container.innerHTML = html;
      container.querySelectorAll(".row:not(.head)").forEach(row => {
        const idx = parseInt(row.dataset.index);
        row.addEventListener("dblclick", () => { playQueueItem(idx); });
        row.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          showContextMenu(e.clientX, e.clientY, idx);
        });
      });
    }

    async function playQueueItem(index) {
      if (index < 0 || index >= queue.length) return;
      queueIndex = index;
      const song = queue[index];
      currentSong = song;
      document.getElementById("songTitle").textContent = song.title;
      document.getElementById("songArtist").textContent =
        `${song.artist} / ${song.album || ""} / ${song.source || "云端"}`;
      try {
        const res = await fetch(`${API}/song_url`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({id: song.id})
        });
        const data = await res.json();
        if (data.code === 200 && data.url) {
          audio.src = data.url;
          audio.play().catch(() => {});
          isPlaying = true;
          isPaused = false;
          position = 0;
          duration = song.duration || 0;
          updatePlayButton();
          updateQueueUI();
          showToast(`正在播放: ${song.title}`);
          fetchLyric(song.id);
          fetchDanmakuPool(song.id);
        } else {
          showToast(data.msg || "无法获取播放链接");
        }
      } catch (e) {
        showToast("播放失败: " + e.message);
      }
    }

    async function fetchLyric(songId) {
      try {
        const res = await fetch(`${API}/lyric`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({id: songId})
        });
        const data = await res.json();
        if (data.code === 200 && data.lyric) {
          parseAndDisplayLyric(data.lyric);
        }
      } catch (e) {}
    }

    let lyricLines = [];
    function parseAndDisplayLyric(lrcText) {
      lyricLines = [];
      const lines = lrcText.split("\n");
      for (const line of lines) {
        const match = line.match(/\[(\d{2}):(\d{2})\.?(\d{0,3})\](.*)/);
        if (match) {
          const time = parseInt(match[1]) * 60 + parseInt(match[2]) + parseInt(match[3] || "0") / 1000;
          const text = match[4].trim();
          if (text) lyricLines.push({time, text});
        }
      }
    }

    function updateLyric() {
      if (!lyricLines.length) return;
      let current = lyricLines[0];
      for (const l of lyricLines) {
        if (l.time <= position) current = l;
        else break;
      }
      document.getElementById("lyricLine").textContent = "> " + current.text;
    }

    function playNext() {
      if (queue.length === 0) return;
      let nextIdx;
      if (playMode === "single_loop") {
        nextIdx = queueIndex;
      } else if (playMode === "shuffle") {
        nextIdx = Math.floor(Math.random() * queue.length);
      } else {
        nextIdx = (queueIndex + 1) % queue.length;
      }
      playQueueItem(nextIdx);
    }

    function playPrev() {
      if (queue.length === 0) return;
      let prevIdx;
      if (playMode === "single_loop") {
        prevIdx = queueIndex;
      } else {
        prevIdx = (queueIndex - 1 + queue.length) % queue.length;
      }
      playQueueItem(prevIdx);
    }

    function showToast(msg) {
      const existing = document.querySelector(".toast");
      if (existing) existing.remove();
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    document.getElementById("playBtn").addEventListener("click", () => {
      initAudioAnalyser();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      if (isPlaying && !isPaused) {
        audio.pause();
        isPaused = true;
      } else if (isPaused) {
        audio.play().catch(() => {});
        isPaused = false;
      } else if (queue.length > 0) {
        playQueueItem(queueIndex >= 0 ? queueIndex : 0);
        return;
      }
      updatePlayButton();
    });

    document.getElementById("prevBtn").addEventListener("click", playPrev);
    document.getElementById("nextBtn").addEventListener("click", playNext);

    const modes = [
      {icon: "↻", label: "列表循环", mode: "list_loop"},
      {icon: "⟳", label: "单曲循环", mode: "single_loop"},
      {icon: "⇄", label: "随机播放", mode: "shuffle"},
    ];
    let modeIndex = 0;
    document.getElementById("modeBtn").addEventListener("click", () => {
      modeIndex = (modeIndex + 1) % modes.length;
      const m = modes[modeIndex];
      playMode = m.mode;
      const btn = document.getElementById("modeBtn");
      btn.textContent = m.icon;
      btn.title = m.label;
      btn.classList.toggle("on", modeIndex !== 0);
      document.getElementById("modeDisplay").textContent = m.label;
      showToast(m.label);
    });

    function makeDraggable(barEl, fillEl, onValue) {
      let dragging = false;
      function calc(e) {
        const rect = barEl.getBoundingClientRect();
        return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      }
      barEl.addEventListener("mousedown", (e) => {
        dragging = true;
        onValue(calc(e));
      });
      document.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        onValue(calc(e));
      });
      document.addEventListener("mouseup", () => { dragging = false; });
    }

    makeDraggable(
      document.getElementById("progressBar"),
      document.getElementById("progressFill"),
      (pct) => {
        if (!duration) return;
        audio.currentTime = pct * duration;
      }
    );

    makeDraggable(
      document.getElementById("volumeBar"),
      document.getElementById("volumeFill"),
      (pct) => {
        volume = Math.round(pct * 100);
        audio.volume = volume / 100;
        document.getElementById("volumeFill").style.width = volume + "%";
        document.getElementById("volumeValue").textContent = volume;
      }
    );

    document.getElementById("tabSpectrum").addEventListener("click", () => {
      document.getElementById("spectrumView").style.display = "flex";
      document.getElementById("danmakuView").style.display = "none";
      document.getElementById("tabSpectrum").classList.add("on");
      document.getElementById("tabDanmaku").classList.remove("on");
    });

    document.getElementById("tabDanmaku").addEventListener("click", () => {
      document.getElementById("spectrumView").style.display = "none";
      document.getElementById("danmakuView").style.display = "block";
      document.getElementById("tabDanmaku").classList.add("on");
      document.getElementById("tabSpectrum").classList.remove("on");
      if (currentSong && currentSong.id) fetchDanmakuPool(currentSong.id);
    });

    let audioCtx = null;
    let analyser = null;
    let audioSource = null;
    let freqData = null;
    let realAudioData = false;

    function initAudioAnalyser() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.75;
        audioSource = audioCtx.createMediaElementSource(audio);
        audioSource.connect(analyser);
        analyser.connect(audioCtx.destination);
        freqData = new Uint8Array(analyser.frequencyBinCount);
      } catch (e) {
        audioCtx = null;
        analyser = null;
      }
    }

    function initSpectrum() {
      const container = document.getElementById("spectrumView");
      const barCount = 48;
      for (let i = 0; i < barCount; i++) {
        const bar = document.createElement("div");
        bar.className = "audio-bar";
        bar.style.height = "2px";
        container.appendChild(bar);
      }
    }

    let zeroFrameCount = 0;

    function animateSpectrum() {
      const bars = document.querySelectorAll(".audio-bar");
      if (audioCtx && analyser && isPlaying && !isPaused) {
        analyser.getByteFrequencyData(freqData);
        let sum = 0;
        for (let i = 0; i < freqData.length; i++) sum += freqData[i];
        if (sum > 0) {
          realAudioData = true;
          zeroFrameCount = 0;
        } else {
          zeroFrameCount++;
          if (zeroFrameCount > 30) realAudioData = false;
        }
        if (realAudioData) {
          const step = Math.max(1, Math.floor(freqData.length / bars.length));
          bars.forEach((bar, i) => {
            const val = freqData[Math.min(i * step, freqData.length - 1)] || 0;
            const h = Math.max(2, (val / 255) * 120);
            bar.style.height = h + "px";
            bar.style.opacity = val > 10 ? "1" : "0.3";
          });
          requestAnimationFrame(animateSpectrum);
          return;
        }
      }
      bars.forEach((bar, i) => {
        const freq = i / bars.length;
        const base = isPlaying && !isPaused ? 8 : 2;
        const low = isPlaying && !isPaused ? 40 * (1 - freq) : 0;
        const mid = isPlaying && !isPaused ? 20 * (1 - Math.abs(freq - 0.3)) : 0;
        const noise = Math.random() * (isPlaying && !isPaused ? 12 : 2);
        const h = base + low + mid + noise;
        bar.style.height = Math.max(2, Math.min(120, h)) + "px";
        bar.style.opacity = isPlaying && !isPaused ? "1" : "0.3";
      });
      requestAnimationFrame(animateSpectrum);
    }

    let danmakuPool = [];
    let danmakuUsed = new Set();
    let danmakuInterval = null;
    let danmakuSongId = null;

    const aiTemplates = [
      (s) => `♪ ${s.title} ♪`,
      (s) => `${s.artist} 的经典之作`,
      (s) => `正在循环 ${s.title}`,
      (s) => `${s.artist} 永远的神`,
      (s) => `深夜听 ${s.title}`,
      (s) => `这首歌太上头了`,
      (s) => `${s.artist} 的声音太好听了`,
      (s) => `单曲循环停不下来`,
      (s) => `${s.title} 前排占座`,
      (s) => `氛围感拉满`,
      (s) => `像素终端 yyds`,
      (s) => `赛博朋克听歌体验`,
      (s) => `${s.artist} 粉丝报到`,
      (s) => `这首歌值得 N 刷`,
      (s) => `Hi-Res 音质绝了`,
    ];

    function generateAiDanmaku() {
      if (!currentSong) return null;
      const tpl = aiTemplates[Math.floor(Math.random() * aiTemplates.length)];
      return { text: tpl(currentSong), user: "AI", liked: 0 };
    }

    async function fetchDanmakuPool(songId) {
      if (songId === danmakuSongId && danmakuPool.length > 0) return;
      danmakuSongId = songId;
      danmakuUsed.clear();
      danmakuPool = [];
      try {
        const res = await fetch(`${API}/danmaku`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({id: songId})
        });
        const data = await res.json();
        if (data.code === 200 && data.comments && data.comments.length > 0) {
          danmakuPool = data.comments.map(c => ({
            text: c.text, user: c.user || "", liked: c.liked || 0
          }));
        }
      } catch (e) {}
    }

    function getNextDanmaku() {
      const unused = danmakuPool.filter(c => !danmakuUsed.has(c.text));
      let item;
      if (unused.length > 0) {
        item = unused[Math.floor(Math.random() * unused.length)];
        danmakuUsed.add(item.text);
      } else if (danmakuPool.length > 0) {
        danmakuUsed.clear();
        item = danmakuPool[Math.floor(Math.random() * danmakuPool.length)];
        danmakuUsed.add(item.text);
      } else {
        item = generateAiDanmaku();
      }
      if (Math.random() < 0.3) {
        const ai = generateAiDanmaku();
        if (ai && Math.random() < 0.5) item = ai;
      }
      return item;
    }

    function startDanmaku() {
      if (danmakuInterval) return;
      const container = document.getElementById("danmakuView");
      danmakuInterval = setInterval(() => {
        if (!isPlaying) return;
        const item = getNextDanmaku();
        if (!item) return;
        const d = document.createElement("span");
        d.className = "danmaku";
        const prefix = item.user ? `${item.user}：` : "";
        d.textContent = prefix + item.text;
        d.style.top = (Math.random() * 75 + 5) + "%";
        d.style.animationDuration = (5 + Math.random() * 4) + "s";
        const r = Math.random();
        if (r > 0.7) {
          d.style.color = "var(--cyan)";
          d.style.textShadow = "0 0 8px var(--cyan-glow)";
        } else if (r > 0.5 && item.liked > 10000) {
          d.style.color = "var(--red)";
          d.style.textShadow = "0 0 8px var(--red-glow)";
        }
        container.appendChild(d);
        setTimeout(() => d.remove(), 10000);
      }, 1800);
    }

    function appendMessage(kind, text) {
      const chat = document.getElementById("chat");
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      const div = document.createElement("div");
      div.className = `msg ${kind}`;
      div.innerHTML = `<div class="meta">${kind === "user" ? "我" : "助手"} ${timeStr}</div>${text}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function handleAgentCommand(text) {
      appendMessage("user", text);
      const keyword = text.trim();
      if (!keyword) return;

      const lowerText = keyword.toLowerCase();
      if (lowerText === "暂停" || lowerText === "停止") {
        audio.pause(); isPaused = true; updatePlayButton();
        appendMessage("agent", "已暂停播放。"); return;
      }
      if (lowerText === "播放" || lowerText === "继续") {
        if (isPaused) {
          audio.play().catch(() => {}); isPaused = false; updatePlayButton();
          appendMessage("agent", "继续播放。");
        } else if (queue.length > 0) {
          playQueueItem(queueIndex >= 0 ? queueIndex : 0);
          appendMessage("agent", "开始播放。");
        }
        return;
      }
      if (lowerText === "下一首") { playNext(); appendMessage("agent", "已切换到下一首。"); return; }
      if (lowerText === "上一首") { playPrev(); appendMessage("agent", "已切换到上一首。"); return; }

      try {
        const res = await fetch(`${API}/search`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({keyword: keyword, limit: 10})
        });
        const data = await res.json();
        if (data.code === 200 && data.songs && data.songs.length > 0) {
          const songs = data.songs;
          queue = songs; queueIndex = -1; updateQueueUI();
          let reply = `找到 ${songs.length} 首相关歌曲：\n`;
          songs.slice(0, 5).forEach((s, i) => {
            reply += `${i + 1}. ${s.title} - ${s.artist}\n`;
          });
          if (songs.length > 5) reply += `...还有 ${songs.length - 5} 首`;
          appendMessage("agent", reply.replace(/\n/g, "<br>"));
          playQueueItem(0);
        } else {
          appendMessage("agent", "未找到相关歌曲，换个关键词试试？");
        }
      } catch (e) {
        appendMessage("agent", "搜索失败，请检查网络连接。");
      }
    }

    document.getElementById("sendBtn").addEventListener("click", () => {
      const input = document.getElementById("agentInput");
      const val = input.value.trim();
      if (!val) return;
      input.value = "";
      handleAgentCommand(val);
    });

    document.getElementById("agentInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("sendBtn").click();
    });

    document.getElementById("searchBtn").addEventListener("click", () => {
      const input = document.getElementById("queueFilter");
      const val = input.value.trim();
      if (!val) { queueFilterText = ""; updateQueueUI(); return; }
      if (queue.length > 0) { queueFilterText = val; updateQueueUI(); }
      else { handleAgentCommand(val); }
    });

    document.getElementById("queueFilter").addEventListener("input", (e) => {
      queueFilterText = e.target.value.trim();
      updateQueueUI();
    });

    document.getElementById("queueFilter").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const val = e.target.value.trim();
        if (queue.length > 0 && val) { queueFilterText = val; updateQueueUI(); }
        else if (val) { handleAgentCommand(val); }
      }
    });

    document.getElementById("btnClose").addEventListener("click", () => {
      if (window.pywebview && window.pywebview.api) window.pywebview.api.close();
      else window.close();
    });

    document.getElementById("btnMin").addEventListener("click", () => {
      if (window.pywebview && window.pywebview.api) window.pywebview.api.minimize();
    });

    document.getElementById("btnMax").addEventListener("click", () => {
      if (window.pywebview && window.pywebview.api) window.pywebview.api.toggle_fullscreen();
    });

    function showContextMenu(x, y, idx) {
      let menu = document.getElementById("ctxMenu");
      if (menu) menu.remove();
      menu = document.createElement("div");
      menu.id = "ctxMenu";
      menu.style.cssText = `position:fixed;left:${x}px;top:${y}px;z-index:200;background:var(--surface-mid);border:1px solid var(--outline-variant);border-radius:4px;padding:4px 0;min-width:120px;font-size:11px;box-shadow:0 8px 24px rgba(0,0,0,.5);`;
      const items = [
        { label: "▶ 播放", action: () => playQueueItem(idx) },
        { label: "✕ 从队列移除", action: () => { queue.splice(idx, 1); if (queueIndex === idx) { audio.pause(); queueIndex = -1; } else if (queueIndex > idx) { queueIndex--; } updateQueueUI(); showToast("已移除"); } },
      ];
      items.forEach(item => {
        const el = document.createElement("div");
        el.textContent = item.label;
        el.style.cssText = "padding:8px 14px;cursor:pointer;color:var(--on-surface-dim);transition:background .1s;";
        el.addEventListener("mouseenter", () => { el.style.background = "var(--primary)"; el.style.color = "var(--on-primary)"; });
        el.addEventListener("mouseleave", () => { el.style.background = "transparent"; el.style.color = "var(--on-surface-dim)"; });
        el.addEventListener("click", () => { item.action(); menu.remove(); });
        menu.appendChild(el);
      });
      document.body.appendChild(menu);
      setTimeout(() => {
        document.addEventListener("click", function rm() { menu.remove(); document.removeEventListener("click", rm); });
      }, 10);
    }

    document.getElementById("modeChip").addEventListener("click", () => {
      document.getElementById("modeChip").classList.add("on");
      document.getElementById("crossChip").classList.remove("on");
      showToast("已切换到云端频道");
    });

    document.getElementById("crossChip").addEventListener("click", () => {
      document.getElementById("crossChip").classList.add("on");
      document.getElementById("modeChip").classList.remove("on");
      showToast("跨平台频道开发中...");
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      switch (e.key) {
        case " ":
          e.preventDefault();
          document.getElementById("playBtn").click();
          break;
        case "ArrowRight":
          e.preventDefault();
          if (e.shiftKey) {
            volume = Math.min(100, volume + 5);
            audio.volume = volume / 100;
            document.getElementById("volumeFill").style.width = volume + "%";
            document.getElementById("volumeValue").textContent = volume;
          } else {
            document.getElementById("nextBtn").click();
          }
          break;
        case "ArrowLeft":
          e.preventDefault();
          if (e.shiftKey) {
            volume = Math.max(0, volume - 5);
            audio.volume = volume / 100;
            document.getElementById("volumeFill").style.width = volume + "%";
            document.getElementById("volumeValue").textContent = volume;
          } else {
            document.getElementById("prevBtn").click();
          }
          break;
        case "ArrowUp":
          e.preventDefault();
          volume = Math.min(100, volume + 5);
          audio.volume = volume / 100;
          document.getElementById("volumeFill").style.width = volume + "%";
          document.getElementById("volumeValue").textContent = volume;
          break;
        case "ArrowDown":
          e.preventDefault();
          volume = Math.max(0, volume - 5);
          audio.volume = volume / 100;
          document.getElementById("volumeFill").style.width = volume + "%";
          document.getElementById("volumeValue").textContent = volume;
          break;
      }
    });

    async function loadTopSongs() {
      try {
        const res = await fetch(`${API}/top_songs`);
        const data = await res.json();
        if (data.code === 200 && data.songs && data.songs.length > 0) {
          queue = data.songs;
          queueIndex = -1;
          updateQueueUI();
        }
      } catch (e) {}
    }

    function updateSystemStatus() {
      const mem = (Math.random() * 4 + 10).toFixed(1);
      const cpu = Math.floor(Math.random() * 15 + 3);
      document.getElementById("statusMem").textContent = `MEM: ${mem}GB / 32GB`;
      document.getElementById("statusCpu").textContent = `CPU_LOAD: ${cpu}%`;
    }

    function mainLoop() {
      updateLyric();
      requestAnimationFrame(mainLoop);
    }

    updateClock();
    setInterval(updateClock, 1000);
    setInterval(updateSystemStatus, 5000);
    updateSystemStatus();

    initSpectrum();
    animateSpectrum();
    startDanmaku();
    mainLoop();
    loadTopSongs();
  </script>
</body>
</html>

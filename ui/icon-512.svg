<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#131314;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#grad1)"/>
  <rect x="10" y="10" width="492" height="492" fill="#131314" stroke="#3c4947" stroke-width="4" rx="12"/>
  
  <!-- Terminal window title bar -->
  <rect x="24" y="24" width="464" height="48" fill="#1e1f20" rx="8 8 0 0"/>
  <circle cx="56" cy="48" r="12" fill="#ff6f7f"/>
  <circle cx="104" cy="48" r="12" fill="#ffd36e"/>
  <circle cx="152" cy="48" r="12" fill="#6feee1"/>
  
  <!-- Retro tape / vinyl -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#6feee1" stroke-width="6" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#6feee1" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#6feee1" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="50" fill="none" stroke="#6feee1" stroke-width="2" opacity="0.2"/>
  <circle cx="256" cy="256" r="20" fill="#6feee1" opacity="0.8"/>
  
  <!-- Pixel bars -->
  <rect x="128" y="416" width="20" height="32" fill="#6feee1" filter="url(#glow)"/>
  <rect x="160" y="408" width="20" height="40" fill="#6feee1" filter="url(#glow)"/>
  <rect x="192" y="392" width="20" height="56" fill="#6feee1" filter="url(#glow)"/>
  <rect x="224" y="380" width="20" height="68" fill="#6feee1" filter="url(#glow)"/>
  <rect x="256" y="376" width="20" height="72" fill="#6feee1" filter="url(#glow)"/>
  <rect x="288" y="380" width="20" height="68" fill="#6feee1" filter="url(#glow)"/>
  <rect x="320" y="392" width="20" height="56" fill="#6feee1" filter="url(#glow)"/>
  <rect x="352" y="408" width="20" height="40" fill="#6feee1" filter="url(#glow)"/>
  <rect x="384" y="416" width="20" height="32" fill="#6feee1" filter="url(#glow)"/>
  
  <!-- Scanline effect -->
  <rect x="14" y="14" width="484" height="484" fill="none" stroke="rgba(111,238,225,0.05)" stroke-width="2" rx="8"/>
</svg>
